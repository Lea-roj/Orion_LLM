<table mat-table [dataSource]="relations" class="mat-elevation-z1 relation-table">

<!-- FROM -->
<ng-container matColumnDef="from">
  <th mat-header-cell *matHeaderCellDef>From</th>
  <td mat-cell *matCellDef="let r">{{ r.head }}</td>
</ng-container>

<!-- TYPE -->
<ng-container matColumnDef="type">
  <th mat-header-cell *matHeaderCellDef>Relation</th>
  <td mat-cell *matCellDef="let r">{{ r.type }}</td>
</ng-container>

<!-- TO -->
<ng-container matColumnDef="to">
  <th mat-header-cell *matHeaderCellDef>To</th>
  <td mat-cell *matCellDef="let r">{{ r.tail }}</td>
</ng-container>

<!-- CONFIDENCE -->
<ng-container matColumnDef="confidence">
  <th mat-header-cell *matHeaderCellDef>Conf.</th>
  <td mat-cell *matCellDef="let r">
    {{ r.confidence | number:'1.2-2' }}
  </td>
</ng-container>

<tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
<tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
